[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "npo"
dynamic = ["version"]
description = "REST API to manage HD image"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE.md" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Graphics",
    "Typing :: Typed",
]
dependencies = [
  "aiosqlite>=0.22.0",
  "alembic>=1.17.2",
  "asyncpg>=0.31.0",
  "fastapi[standard]>=0.125.0",
  "fastapi-babel>=1.0",
  "greenlet>=3.3.0",
  "psycopg[binary,pool]>=3.3.2",
  "pydantic-settings>=2.12.0",
  "pyexiftool>=0.5.6",
  "python-dotenv>=1.2.1",
  "python-magic>=0.4.27",
  "python-multipart>=0.0.22",
  "pyvips[binary]>=3.1.1",
  "sqlalchemy>=2.0.45",
  "urllib3>=2.6.3", # Force the security fix CVE-2026-21441
  "pwdlib[argon2]>=0.3.0",
  "pyjwt>=2.11.0",
  "authlib>=1.6.7",
  "httpx>=0.28.1",
  "itsdangerous>=2.2.0",
  "email-validator>=2.3.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.9.8",
    "httpx>=0.28.1",
    "pip-audit>=2.8.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-datadir>=1.8.0",
    "pytest-cov>=6.0.0",
    "pytest-dotenv>=0.5.2",
    "pytest-sugar>=1.0.0",
    "ruff>=0.14.10",
    "setuptools-scm>=8.0",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools_scm]
write_to = "src/npo/version.py"


[tool.ruff]
line-length = 100
exclude = [
    ".eggs",
    ".git",
    ".tox",
    ".venv",
    "version.py",
]
src = ["src"]

[tool.ruff.lint]
# E et W : pycodestyle (PEP8)
# F : Pyflakes
# I : iSort
# PL : Pylint
# PT = flake8-pytest-style (Pytest specific rules)
# B  = flake8-bugbear (Recommanded by Flake8 to avoid issues)
# UP = pyupgrade (Keep code modern, e.g. type hints)
# C90 = mccabe (Check complexity)
# SIM = flake8-simplify (Suggestions to simplify code)
# T20 = flake8-print (Deny print statements, prefer logging)
# RUF = Ruff specific rules
select = ["E", "W", "F", "I", "PL", "PT", "B", "UP", "C90", "SIM", "T20", "RUF"]
ignore = [
    "D103",    # missing-function-docstring
    "D100",    # missing-module-docstring
    "D101",    # missing-class-docstring
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = true

[tool.ruff.lint.per-file-ignores]
# Ignore not used imports (F401) in this specific files
"src/npo/modules/models.py" = ["F401"]
"migrations/env.py" = ["F401"]
"tests/conftest.py" = ["F401"]

[tool.alembic]
script_location = "%(here)s/migrations"
prepend_sys_path = [
    ".",
    "src",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--durations=5 --import-mode=importlib"
env_files = [
    ".env.test"
]
markers = [
    "skip_seed: mark test to skip seeded data and force real upload",
]
log_cli = false
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.coverage.run]
source = ["npo"]
omit = [
	"src/npo/version.py",
]
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
show_missing = true

[tool.pyright]
include = ["src", "tests"]
ignore = ["tests"]
stubPath = "typings"
typeCheckingMode = "basic"
reportMissingTypeStubs = true
pythonVersion = "3.13"
# executionEnvironments = [
#   { root=".", extraPaths=["src", "."] }
# ]
